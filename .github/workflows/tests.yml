name: Test and release

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests
      - run: python -m compileall -q custom_components

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  live-ministry:
    name: Verify live Ministry calendar before release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check Ministry's published holiday data
        run: python tests/check_live_ministry.py

  release:
    name: Publish validated version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit-tests, hassfest, live-ministry]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release when version changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("custom_components/luxembourg_school_calendar/manifest.json"))["version"])')"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists."
            exit 0
          fi
          gh release create "$VERSION" --target "$GITHUB_SHA" \
            --title "Luxembourg School Calendar $VERSION" \
            --notes-file RELEASE_NOTES.md
